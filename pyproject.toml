[project]
name = "grocery-db"
version = "0.1.0"
description = "Australian grocery price history: Woolworths, Coles, Aldi"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "boto3>=1.34",
    # Dashboard deps are core because Streamlit Cloud runs plain `uv sync`
    # (it prefers uv.lock over requirements.txt and cannot install extras).
    "streamlit>=1.36",
    "pandas>=2.0",
    "plotly>=5.20",
]

[project.optional-dependencies]
coles-browser = [
    "camoufox[geoip]>=0.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gdb = "grocery_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_db"]
